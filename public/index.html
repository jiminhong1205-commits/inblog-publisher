<p>거래처 이탈 리스크 65.5억 원. 담당자 이직률 15.6%에서 연간 거래처 맥락 소멸이 만드는 이탈 가능성입니다. 발주 누락·지연 리스크 50억 원. 개인 카카오에서 발주 메시지가 묻혀 처리되지 않거나 납기 변경이 생산 계획에 반영되지 않는 경우의 연간 추정입니다. 문서 오전달 리스크 3억 원. 잘못된 도면이나 구버전 사양서가 거래처에 전달된 경우입니다. 합산 118.5억 원입니다.</p>
<p>이 조직이 채택한 클라우드 구독형 솔루션 연간 비용은 5,540만 원입니다. 리스크 노출액 대비 비용 비율 0.47%입니다.</p>

<p><strong>Q. 제조업 규모에 따라 이 리스크 수치가 달라지나요?</strong><br>거래처 수, 담당자 이직률, 건당 발주 금액의 조합에 따라 달라집니다. 중소 제조업체는 거래처 수가 적어도 핵심 거래처 의존도가 높아 이탈 리스크 단가가 커집니다. 대형 제조업체는 거래처 수가 많아 파편화 리스크가 더 큽니다. 업종과 규모에 맞게 리스크를 수치화하면 투자 근거가 명확해집니다.</p>

<h2>카카오가 선택되는 이유 — 거래처 측 변화 없음</h2>
<p>제조업에서 다른 협업 도구가 아닌 카카오가 선택되는 결정적 이유가 있습니다. 거래처 측의 변화가 없습니다.</p>
<p>카카오워크, 잔디, MS Teams는 외부 파트너가 계정을 만들어야 합니다. 수십 개 협력사 담당자 모두에게 새 계정 생성을 요청하는 것은 현실적으로 어렵습니다. 카카오 기반 기업 채널은 다릅니다. 협력사 담당자는 기존에 쓰던 카카오톡으로 그대로 진입합니다. 별도 앱 설치 없음, 계정 생성 없음, 추가 과금 없음. 우리 측만 채널을 공식화하면 됩니다.</p>

<p><strong>Q. 카카오 기업채널과 일반 카카오 상담톡의 차이는 무엇인가요?</strong><br>일반 카카오 상담톡은 1:1 또는 제한적 그룹 구조입니다. 카카오 기반 기업 채널은 멀티채팅을 지원합니다. 하나의 채팅방에 여러 명의 담당자와 거래처 담당자가 참여하는 구조입니다. 대화 이력이 조직 서버에 보존되고, 역할별 접근 권한이 분리되며, 비즈폼을 통한 업무 정보 자동 처리가 가능합니다.</p>

<h2>G전선·S렌터카 — 두 가지 축에서 확인된 것</h2>
<p>H클러스터에서 기존 발행 사례인 G전선과 S렌터카는 두 가지 다른 축에서 카카오 기업채널의 가치를 보여줍니다.</p>
<p>G전선은 제조업 거래처 소통의 이력 보존과 업무 데이터화 축입니다. 영업·구매·품질 부서가 각자 개인 카카오로 분산 관리하던 거래처 소통을 조직 채널로 일원화하고, 텍스트 정보를 업무 시스템에 연동했습니다. S렌터카는 영업사원 대화 이력의 조직 자산화 축입니다. 200명 영업사원이 개인 카카오로 고객과 쌓아온 이력이 사라지는 구조를 조직 서버 보존 구조로 전환했습니다.</p>
<p>두 사례가 보여주는 공통점은 하나입니다. 대화가 개인 기기에서 조직 서버로 이동하는 것이 전환의 본질입니다.</p>

<p><strong>Q. 제조업 외에 어떤 업종에서 유사한 구조가 적용되고 있나요?</strong><br>금융(보험사 GA 설계사 채널), 렌터카(영업사원 고객 채널), 해운·물류(글로벌 파트너 채널)에서 동일한 구조가 적용됩니다. 외부 파트너가 있고, 담당자 이직이 발생하며, 소통 이력이 중요한 모든 업종에서 이 구조가 가치를 가집니다. 업종별 외부 협업 채널 운영 비교는 클러스터 I에서 이어집니다.</p>

<h2>H클러스터 종합 — 제조업이 카카오를 선택하는 세 가지 이유</h2>
<ol>
<li><strong>리스크 방어</strong> — 118.5억 리스크를 0.47% 비용으로 방어. 담당자 이직·발주 누락·문서 오전달 구조적 해소.</li>
<li><strong>거래처 마찰 없음</strong> — 협력사가 기존 카카오톡 그대로 사용. 계정 생성·앱 설치 불필요. 유일하게 거래처 측 변화 없이 채널을 공식화할 수 있는 구조.</li>
<li><strong>데이터 자산화</strong> — 대화 이력이 조직 서버에 보존되어 인수인계, 관계 관리, 분쟁 증빙에 활용 가능.</li>
</ol>
<hr><p>📌 이전글 보기: 거래처와 나눈 카카오 대화, 영업 자산으로 만드는 법</p>`
  }
];


const done={}, failed={};
function getKey(){ return document.getElementById('key').value.trim().replace(/[^\x20-\x7E]/g, ''); }
function toggleKey(){const i=document.getElementById('key');i.type=i.type==='password'?'text':'password';}
function addLog(msg,type='linfo'){const el=document.getElementById('logs');const d=document.createElement('div');d.className=`le ${type}`;d.textContent=`[${new Date().toLocaleTimeString('ko-KR')}] ${msg}`;el.appendChild(d);el.scrollTop=el.scrollHeight;}
function updateStats(){document.getElementById('sDone').textContent=Object.keys(done).length;document.getElementById('sErr').textContent=Object.keys(failed).length;}
function authH(k){return{'Authorization':`Bearer ${k}`,'Content-Type':'application/json'};}
function apiUrl(path,query){const qs=query?'&'+new URLSearchParams(query).toString():'';return `/api/proxy?p=${encodeURIComponent(path)}${qs}`;}
async function verify(){
  const k=getKey();if(!k){addLog('API Key를 입력하세요','lerr');return;}
  const btn=document.getElementById('vBtn');btn.disabled=true;btn.textContent='확인 중...';
  try{const r=await fetch(apiUrl('posts',{page:1,limit:1}),{headers:authH(k)});
  if(r.ok){document.getElementById('ks').innerHTML='<span style="color:#059669">✅ 연결 성공</span>';addLog('연결 완료','lok');}
  else{document.getElementById('ks').innerHTML=`<span style="color:#dc2626">❌ 실패 (${r.status})</span>`;addLog(`실패: ${r.status}`,'lerr');}
  }catch(e){document.getElementById('ks').innerHTML='<span style="color:#dc2626">❌ 오류</span>';addLog(`오류: ${e.message}`,'lerr');}
  btn.disabled=false;btn.textContent='연결 확인';
}
async function publishOne(p){
  const k=getKey();if(!k){addLog('API Key 없음','lerr');return;}
  const card=document.getElementById(`c-${p.id}`);
  card.className='pc active';setIcon(p.id,'ic-run','...');
  addLog(`발행 시작: ${p.title.slice(0,30)}...`);
  try{
    const payload={jsonapi:{version:'1.0'},data:{type:'posts',attributes:{
      title:p.title,slug:p.slug,description:p.desc,content_html:p.html,
      published:false,published_at:p.date,meta_title:p.metaTitle,
      meta_description:p.metaDesc,canonical_url:'',cta_text:''}}};
    let pid=null;
    const r1=await fetch(apiUrl('posts'),{method:'POST',headers:authH(k),body:JSON.stringify(payload)});
    if(r1.status===201){const j=await r1.json();pid=j.data.id;addLog(`✅ 생성 완료 (ID: ${pid}) — ${p.date.slice(0,10)} 예약`,'lok');}
    else if(r1.status===409){
      addLog('기존 draft 확인 중...');
      const rL=await fetch(apiUrl('posts',{page:1,limit:100}),{headers:authH(k)});
      const jL=await rL.json();
      const ex=jL.data&&jL.data.find(x=>x.attributes.slug===p.slug);
      if(!ex)throw new Error('기존 글을 찾을 수 없습니다');
      pid=ex.id;
      await fetch(apiUrl(`posts/${pid}`),{method:'PATCH',headers:authH(k),
        body:JSON.stringify({jsonapi:{version:'1.0'},data:{type:'posts',id:String(pid),
        attributes:{title:p.title,description:p.desc,content_html:p.html,
        published_at:p.date,meta_title:p.metaTitle,meta_description:p.metaDesc}}})});
      addLog(`✅ 기존 글 업데이트 (ID: ${pid}) — ${p.date.slice(0,10)} 예약`,'lok');
    } else {const t=await r1.text();throw new Error(`실패 ${r1.status}: ${t.slice(0,150)}`);}
    card.className='pc done';setIcon(p.id,'ic-done','✓');
    done[p.id]=true;delete failed[p.id];
  }catch(e){addLog(`오류: ${e.message}`,'lerr');card.className='pc fail';setIcon(p.id,'ic-err','✕');failed[p.id]=true;delete done[p.id];}
  updateStats();
}
function setIcon(id,cls,txt){const el=document.getElementById(`i-${id}`);el.className=`icon ${cls}`;el.textContent=txt;}
async function pubReady(){const list=POSTS.filter(p=>p.ready&&!done[p.id]);if(!list.length){addLog('없음');return;}showProgress();for(let i=0;i<list.length;i++){setProgress((i/list.length)*100);await publishOne(list[i]);await sleep(800);}setProgress(100);addLog('완료','lok');}
async function pubAll(){const list=POSTS.filter(p=>!done[p.id]);showProgress();for(let i=0;i<list.length;i++){setProgress((i/list.length)*100);await publishOne(list[i]);await sleep(800);}setProgress(100);addLog('전체 완료','lok');}
function showProgress(){document.getElementById('prog').style.display='block';}
function setProgress(v){document.getElementById('progFill').style.width=v+'%';}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function render(){
  const list=document.getElementById('postList');list.innerHTML='';
  POSTS.forEach(p=>{
    const d=new Date(p.date);const days=['일','월','화','수','목','금','토'];
    const card=document.createElement('div');card.className='pc';card.id=`c-${p.id}`;
    card.innerHTML=`<div class="icon ic-ok" id="i-${p.id}">✓</div><div class="pi"><div class="pw">${p.week}</div><div class="pt">${p.title}</div><div class="pd">${d.getMonth()+1}/${d.getDate()} ${days[d.getDay()]}요일 10:00 · <span class="badge b-ok">본문 완성</span></div></div><button class="btn btn-gray btn-sm" onclick="publishOne(POSTS[${POSTS.indexOf(p)}])">발행</button>`;
    list.appendChild(card);
  });
}
render();
</script>
