<p><strong>Q. Cowork+ NOA 시너지가 실제로 비즈니스 자산이 되는 과정을 설명해 주세요.</strong><br>대화가 비즈니스 자산이 되는 과정은 세 단계입니다. Cowork+가 외부 협업 대화를 조직 채널로 수집하고, NOA가 분류·분석하여 패턴과 인사이트를 추출하며, 경영진과 운영 담당자가 이 데이터를 의사결정에 활용합니다.</p>
<h2>대화가 비즈니스 자산이 되는 구조</h2>
<p>Cowork+ NOA를 통해 완성되는 구조는 단순합니다.</p>
<ol>
<li><strong>수집</strong> — Cowork+가 거래처·고객·파트너와의 카카오 대화를 조직 서버에 보존합니다.</li>
<li><strong>분석</strong> — NOA가 쌓인 대화를 자동 분류하고 품질·리스크·인사이트를 추출합니다.</li>
<li><strong>활용</strong> — 경영 판단, 운영 개선, 리스크 관리, 인수인계에 데이터를 사용합니다.</li>
</ol>
<p>이 구조가 갖춰지면 매일 오가는 카카오 대화가 조직의 지식 자산으로 전환됩니다.</p>
<p><strong>Q. Cowork+ NOA 도입 후 데이터가 자산으로 전환되려면 얼마나 걸리나요?</strong><br>대화 데이터는 도입 즉시 쌓이기 시작합니다. 분석에 의미 있는 패턴이 나타나려면 통상 3개월 이상의 데이터가 필요합니다. 업종과 채널 규모에 따라 차이가 있습니다.</p>
<p>Cowork+ NOA 시너지는 외부 협업 인프라와 AI 분석 엔진의 결합입니다. 대화가 쌓이는 구조와 대화에서 가치를 추출하는 구조가 함께 갖춰질 때, 조직의 소통은 비즈니스 자산이 됩니다.</p>
<hr><p>📌 이전글 보기: Cowork+ 도입 전 최종 체크리스트 — 우리 조직에 맞는지 확인하는 법</p>`
  },
];

const done={}, failed={};
function getKey(){return document.getElementById('key').value.trim();}
function toggleKey(){const i=document.getElementById('key');i.type=i.type==='password'?'text':'password';}
function addLog(msg,type='linfo'){const el=document.getElementById('logs');const d=document.createElement('div');d.className=`le ${type}`;d.textContent=`[${new Date().toLocaleTimeString('ko-KR')}] ${msg}`;el.appendChild(d);el.scrollTop=el.scrollHeight;}
function updateStats(){document.getElementById('sDone').textContent=Object.keys(done).length;document.getElementById('sErr').textContent=Object.keys(failed).length;}
function authH(k){return{'Authorization':`Bearer ${k}`,'Content-Type':'application/json'};}
async function verify(){
  const k=getKey();if(!k){addLog('API Key를 입력하세요','lerr');return;}
  const btn=document.getElementById('vBtn');btn.disabled=true;btn.textContent='확인 중...';
  try{
    const r=await fetch(apiUrl('posts',{page:1,limit:1}),{headers:authH(k)});
    if(r.ok){document.getElementById('ks').innerHTML='<span style="color:#059669">✅ 연결 성공</span>';addLog('연결 완료','lok');}
    else{document.getElementById('ks').innerHTML=`<span style="color:#dc2626">❌ 실패 (${r.status})</span>`;addLog(`실패: ${r.status}`,'lerr');}
  }catch(e){document.getElementById('ks').innerHTML='<span style="color:#dc2626">❌ 오류</span>';addLog(`오류: ${e.message}`,'lerr');}
  btn.disabled=false;btn.textContent='연결 확인';
}
async function publishOne(p){
  const k=getKey();if(!k){addLog('API Key 없음','lerr');return;}
  const card=document.getElementById(`c-${p.id}`);
  card.className='pc active';setIcon(p.id,'ic-run','...');
  addLog(`발행 시작: ${p.title.slice(0,30)}...`);
  try{
    const payload={jsonapi:{version:'1.0'},data:{type:'posts',attributes:{
      title:p.title,slug:p.slug,description:p.desc,
      content_html:p.html,published:false,published_at:p.date,
      meta_title:p.metaTitle,meta_description:p.metaDesc,
      canonical_url:'',cta_text:''
    }}};
    let pid=null;
    const r1=await fetch(apiUrl('posts'),{method:'POST',headers:authH(k),body:JSON.stringify(payload)});
    if(r1.status===201){
      const j=await r1.json();pid=j.data.id;
      addLog(`✅ 생성 완료 (ID: ${pid}) — ${p.date.slice(0,10)} 예약`,'lok');
    } else if(r1.status===409){
      addLog('기존 draft 확인 중...');
      const rL=await fetch(apiUrl('posts',{page:1,limit:100}),{headers:authH(k)});
      const jL=await rL.json();
      const ex=jL.data&&jL.data.find(x=>x.attributes.slug===p.slug);
      if(!ex)throw new Error('기존 글을 찾을 수 없습니다');
      pid=ex.id;
      const r2=await fetch(apiUrl(`posts/${pid}`),{method:'PATCH',headers:authH(k),
        body:JSON.stringify({jsonapi:{version:'1.0'},data:{type:'posts',id:String(pid),attributes:{published_at:p.date}}})});
      addLog(`✅ 기존 글 업데이트 (ID: ${pid}) — ${p.date.slice(0,10)} 예약`,'lok');
    } else {
      const t=await r1.text();throw new Error(`실패 ${r1.status}: ${t.slice(0,150)}`);
    }
    card.className='pc done';setIcon(p.id,'ic-done','✓');
    done[p.id]=true;delete failed[p.id];
  }catch(e){
    addLog(`오류: ${e.message}`,'lerr');
    card.className='pc fail';setIcon(p.id,'ic-err','✕');
    failed[p.id]=true;delete done[p.id];
  }
  updateStats();
}
function setIcon(id,cls,txt){const el=document.getElementById(`i-${id}`);el.className=`icon ${cls}`;el.textContent=txt;}
async function pubReady(){const list=POSTS.filter(p=>p.ready&&!done[p.id]);if(!list.length){addLog('완료된 글 없음');return;}showProgress();for(let i=0;i<list.length;i++){setProgress((i/list.length)*100);await publishOne(list[i]);await sleep(800);}setProgress(100);addLog('완료','lok');}
async function pubAll(){const list=POSTS.filter(p=>!done[p.id]);showProgress();for(let i=0;i<list.length;i++){setProgress((i/list.length)*100);await publishOne(list[i]);await sleep(800);}setProgress(100);addLog('전체 완료','lok');}
function showProgress(){document.getElementById('prog').style.display='block';}
function setProgress(v){document.getElementById('progFill').style.width=v+'%';}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function render(){
  const list=document.getElementById('postList');list.innerHTML='';
  POSTS.forEach(p=>{
    const d=new Date(p.date);const days=['일','월','화','수','목','금','토'];
    const card=document.createElement('div');card.className='pc';card.id=`c-${p.id}`;
    card.innerHTML=`<div class="icon ic-ok" id="i-${p.id}">✓</div><div class="pi"><div class="pw">${p.week}</div><div class="pt">${p.title}</div><div class="pd">${d.getMonth()+1}/${d.getDate()} ${days[d.getDay()]}요일 10:00 · <span class="badge b-ok">본문 완성</span></div></div><button class="btn btn-gray btn-sm" onclick="publishOne(POSTS[${POSTS.indexOf(p)}])">발행</button>`;
    list.appendChild(card);
  });
}
render();
</script>
